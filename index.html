function normalize(data){
 const d=sample(); if(!data||typeof data!=="object") return d;
 d.meta={...d.meta,...(data.meta&&typeof data.meta==="object"?data.meta:{})};
 for(const key of ["apps","contacts","wechatChats","smsThreads","calls","photos","songs","products","payments","notes"])
   if(Array.isArray(data[key])) d[key]=data[key].filter(x=>x&&typeof x==="object").slice(0,1000);
 return d;
}

function field(name,label,value,type="text",wide=false,opts=null,scope="item"){
 const attr=`data-${scope}-field="${esc(name)}"`, val=esc(value??"");
 let control;
 if(type==="textarea")control=`<textarea ${attr} rows="4">${val}</textarea>`;
 else if(type==="select")control=`<select ${attr}>${(opts||[]).map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?"selected":""}>${esc(l)}</option>`).join("")}</select>`;
 else if(type==="checkbox")control=`<label class="check-row"><input type="checkbox" ${attr} ${value?"checked":""}>显示在桌面</label>`;
 else control=`<input ${attr} type="${type}" value="${val}" ${type==="number"?"min=0 max=100":""}>`;
 return `<label class="field ${wide?"wide":""}"><span class="field-label">${esc(label)}</span>${control}</label>`;
}

function renderPhone(){const root=$("#phone-root");if(!root)return;if(phone.screen==="lock"||phone.screen==="pin")root.innerHTML=lockHTML();else if(phone.screen==="home")root.innerHTML=homeHTML();else{const a=project.apps.find(x=>x.id===phone.app);let page=(!a?null:{wechat:wechatHTML,sms:smsHTML,phone:callsHTML,photos:photosHTML,music:musicHTML,shop:shopHTML,pay:payHTML,notes:notesHTML,settings:settingsHTML}[a.key]?.())||customHTML(a||{name:"应用",icon:"◇",color:"#777",content:""});root.innerHTML=`<div class="pscreen"><div class="papp">${statusHTML(false)}<div class="papp-header"><button class="back" type="button" data-p-action="${page.back?"back":"home"}">‹ ${page.back?"返回":"桌面"}</button><h2>${esc(page.title)}</h2></div><div class="papp-body">${page.html}</div>${page.tabs||""}</div><button class="homebar" type="button" data-p-action="home" aria-label="返回桌面"></button></div>`}
 const w=root.querySelector(".pwall");if(w){const img=safeImage(phone.screen==="lock"||phone.screen==="pin"?project.meta.lockWallpaper||project.meta.wallpaper:project.meta.wallpaper);w.style.backgroundImage=img?`url("${img}")`:`linear-gradient(160deg, ${/^#[0-9a-f]{3,8}$/i.test(project.meta.wallColor)?project.meta.wallColor:"#394e88"}, #514b83 48%, #d2a6bb)`}}
function phoneClick(e){const b=e.target.closest("[data-p-action]");if(!b)return;const act=b.dataset.pAction,id=b.dataset.id||"";
 if(act==="locktap"){phone.screen="pin";phone.pin="";phone.pinError=""}
 else if(act==="digit"){const v=b.dataset.value;if(v==="⌫")phone.pin=phone.pin.slice(0,-1);else phone.pin+=v;const target=String(project.meta.password||"1121");if(phone.pin.length>=target.length){if(phone.pin===target){phone.screen="home";phone.pinError=""}else{phone.pinError="密码不正确，请再试一次";phone.pin=""}}}
 else if(act==="pin-cancel"){phone.screen="lock";phone.pin="";phone.pinError=""}
 else if(act==="home"){phone.screen="home";phone.detail=""}
 else if(act==="app"){phone.screen="app";phone.app=id;phone.detail="";phone.tab="chats"}
 else if(act==="detail"){phone.detail=id}
 else if(act==="back"){phone.detail=""}
 else if(act==="tab"){phone.tab=id;phone.detail=""}
 renderPhone();
}
function setSelected(id){selected[section]=id;selectedMessage="";renderEditor()}
function addItem(){const item=makeItem(section);if(!item)return;project[section].push(item);selected[section]=item.id;selectedMessage="";changed();renderEditor()}
function deleteItem(id){const item=project[section].find(x=>x.id===id);if(!item)return;if(!confirm(`删除“${itemLabel(section,item)}”？`))return;project[section]=project[section].filter(x=>x.id!==id);selected[section]=project[section][0]?.id||"";selectedMessage="";changed();renderEditor()}
function moveItem(id,dir){const arr=project.apps,i=arr.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];changed();renderEditor()}
function addMessage(){const cur=currentItem();if(!cur)return;cur.messages ||= [];const m={id:uid(),from:"other",text:"新消息",time:timeNow(),image:""};cur.messages.push(m);selectedMessage=m.id;changed();renderEditor()}
function deleteMessage(id){const cur=currentItem();if(!cur)return;cur.messages=(cur.messages||[]).filter(x=>x.id!==id);selectedMessage=cur.messages[0]?.id||"";changed();renderEditor()}
function currentMessage(){return (currentItem()?.messages||[]).find(x=>x.id===selectedMessage)}
function editInput(el){let obj,key;if(el.dataset.metaField){obj=project.meta;key=el.dataset.metaField}else if(el.dataset.itemField){obj=currentItem();key=el.dataset.itemField}else if(el.dataset.messageField){obj=currentMessage();key=el.dataset.messageField}else return;if(!obj)return;let val=el.type==="checkbox"?el.checked:el.value;if(key==="password"){val=String(val).replace(/\D/g,"").slice(0,8);el.value=val}obj[key]=val;changed()}
function editorClick(e){const b=e.target.closest("button");if(!b)return;
 if(b.dataset.section){section=b.dataset.section;selectedMessage="";renderEditor();return}
 if(b.hasAttribute("data-add-item")){addItem();return}
 if(b.dataset.selectItem){setSelected(b.dataset.selectItem);return}
 if(b.dataset.deleteItem){deleteItem(b.dataset.deleteItem);return}
 if(b.dataset.move){moveItem(b.dataset.move,Number(b.dataset.dir));return}
 if(b.hasAttribute("data-add-message")){addMessage();return}
 if(b.dataset.selectMessage){selectedMessage=b.dataset.selectMessage;renderEditor();return}
 if(b.dataset.deleteMessage){deleteMessage(b.dataset.deleteMessage);return}
 if(b.dataset.removeImage){const obj=b.dataset.uploadScope==="meta"?project.meta:b.dataset.uploadScope==="message"?currentMessage():currentItem();if(obj){obj[b.dataset.removeImage]="";changed();renderEditor()}return}
 if(b.dataset.do)doAction(b.dataset.do);
}
function imageData(file){return new Promise((resolve,reject)=>{if(!file.type.startsWith("image/"))return reject(Error("请选择图片文件"));if(file.size>20*1024*1024)return reject(Error("单张图片不能超过 20 MB"));const r=new FileReader();r.onerror=()=>reject(Error("图片读取失败"));r.onload=()=>{const img=new Image();img.onerror=()=>reject(Error("图片无法打开"));img.onload=()=>{const max=1400,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/webp",.78))};img.src=r.result};r.readAsDataURL(file)})}
async function editorChange(e){const el=e.target;if(el.matches("input[type=file][data-upload]")){const file=el.files?.[0];if(!file)return;try{const data=await imageData(file),scope=el.dataset.uploadScope,obj=scope==="meta"?project.meta:scope==="message"?currentMessage():currentItem();if(obj){obj[el.dataset.upload]=data;changed();renderEditor();toast("图片已加入项目")}}catch(err){toast(err.message)}return}if(el.matches("[data-meta-field],[data-item-field],[data-message-field]")){editInput(el);renderEditor()}}
function download(name,content,mime){const blob=content instanceof Blob?content:new Blob([content],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
function filename(){return String(project.meta.title||"捡手机作品").replace(/[\\/:*?"<>|]/g,"_").slice(0,48)||"捡手机作品"}
function exportHTML(){const clone=document.documentElement.cloneNode(true);clone.querySelector("body").dataset.exported="1";delete clone.querySelector("body").dataset.share;clone.querySelector("title").textContent=(project.meta.title||"捡手机作品")+" · 拾光手机工坊";clone.querySelector("#editor-content").innerHTML="";clone.querySelector("#phone-root").innerHTML="";clone.querySelector("#embedded-project").textContent=JSON.stringify(project).replace(/</g,"\\u003c");const html="<!doctype html>\n"+clone.outerHTML;download(filename()+".html",html,"text/html;charset=utf-8");toast("已导出独立网页")}
function exportJSON(){download(filename()+"-项目.json",JSON.stringify(project,null,2),"application/json;charset=utf-8");toast("项目文件已导出")}
async function importJSON(file){try{const text=await file.text(),data=JSON.parse(text);if(!data.meta||!Array.isArray(data.apps))throw Error("这不是拾光手机工坊的项目文件");if(!confirm("导入会替换当前项目，继续吗？"))return;project=normalize(data);section="system";selected={};selectedMessage="";phone={screen:"home",app:"",detail:"",tab:"chats",pin:"",pinError:""};changed();renderEditor();toast("项目已导入")}catch(err){toast("导入失败："+err.message)}}
function bytesToB64(bytes){let s="";for(let i=0;i<bytes.length;i+=16384)s+=String.fromCharCode(...bytes.subarray(i,i+16384));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}
function b64ToBytes(s){const b=atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"="));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function encodeShare(p){const raw=new TextEncoder().encode(JSON.stringify(p));if(typeof CompressionStream!=="undefined"){const stream=new Blob([raw]).stream().pipeThrough(new CompressionStream("gzip"));return "g"+bytesToB64(new Uint8Array(await new Response(stream).arrayBuffer()))}return "j"+bytesToB64(raw)}
async function decodeShare(s){const kind=s[0],bytes=b64ToBytes(s.slice(1));const decoded=kind==="g"&&typeof DecompressionStream!=="undefined"?new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer()):bytes;return JSON.parse(new TextDecoder().decode(decoded))}
async function shareLink(){try{const payload=await encodeShare(project),url=PUBLIC_EDITOR_URL+"#p="+payload;if(url.length>100000){toast("作品包含较多图片，请导出独立 HTML 分享");return}const area=$("#share-url");area.value=url;let copied=false;try{await navigator.clipboard.writeText(url);copied=true}catch{area.focus();area.select();try{copied=document.execCommand("copy")}catch{}}$("#share-note").textContent=`链接已生成（约 ${Math.max(1,Math.round(url.length/1024))} KB）。${copied?"已复制，可发送给读者。":"请选中上方链接并复制。"} 链接较长，请优先使用浏览器打开。`;toast(copied?"分享链接已复制":"链接已生成，请手动复制")}catch(err){toast("链接生成失败："+err.message)}}
function doAction(act){if(act==="export-html")return exportHTML();if(act==="export-json")return exportJSON();if(act==="import-json")return $("#project-file").click();if(act==="share-link")return shareLink();if(act==="reset"){if(!confirm("恢复示例项目？当前编辑内容将被替换。请先导出项目 JSON。"))return;project=sample();section="system";selected={};selectedMessage="";changed();renderEditor();toast("已恢复示例项目")}}
async function boot(){try{const embedded=$("#embedded-project").textContent.trim();if(embedded){project=normalize(JSON.parse(embedded));exported=true;document.body.dataset.exported="1"}else if(location.hash.startsWith("#p=")){project=normalize(await decodeShare(location.hash.slice(3)));shared=true;document.body.dataset.share="1"}else project=normalize(await loadSaved())}catch(err){project=sample();toast("项目读取失败，已打开示例")}phone.screen=exported||shared?"lock":"home";if(exported||shared)document.title=(project.meta.title||"捡手机作品")+" · 拾光手机工坊";$("#project-label").textContent=project.meta.title;renderEditor();renderPhone();if(!exported&&!shared)$("#save-status").textContent="已就绪 · 自动保存";
 $("#section-nav").addEventListener("click",editorClick);$("#editor-content").addEventListener("click",editorClick);$("#editor-content").addEventListener("input",e=>{if(e.target.matches("[data-meta-field],[data-item-field],[data-message-field]"))editInput(e.target)});$("#editor-content").addEventListener("change",editorChange);$("#phone-root").addEventListener("click",phoneClick);$("#preview-lock").addEventListener("click",()=>{phone.screen="lock";phone.pin="";phone.detail="";renderPhone();document.querySelector(".preview-shell").scrollIntoView({behavior:"smooth"})});$("#quick-export").addEventListener("click",exportHTML);$("#project-file").addEventListener("change",e=>{if(e.target.files?.[0])importJSON(e.target.files[0]);e.target.value=""});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&phone.screen==="app"){phone.detail?phone.detail="":phone.screen="home";renderPhone()}});

function enrich(d,original={}){

 if(!Array.isArray(original.playlists)){d.playlists=[{id:"liked",name:"我喜欢的音乐",description:"把喜欢留在这里",cover:"",songIds:d.songs.map(s=>s.id)}]}
 d.songs=d.songs.map(s=>({source:"url",lyrics:"",neteaseId:"",...s}));
 d.wechatChats=d.wechatChats.map(c=>({...c,typing:!!c.typing,messages:(c.messages||[]).map(m=>({type:m.image?"image":"text",amount:"8.88",state:"pending",duration:"5",stickerId:"",...m}))}));
 d.smsThreads=d.smsThreads.map(c=>({...c,messages:(c.messages||[]).map(m=>({type:"text",...m}))}));

 return d;

function seconds(t){if(!Number.isFinite(t))return"0:00";return Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0")}
function demoWav(){if(demoAudioUrl)return demoAudioUrl;const rate=16000,len=rate*12,buf=new ArrayBuffer(44+len*2),v=new DataView(buf);const str=(p,s)=>[...s].forEach((c,i)=>v.setUint8(p+i,c.charCodeAt(0)));str(0,"RIFF");v.setUint32(4,36+len*2,true);str(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,"data");v.setUint32(40,len*2,true);for(let i=0;i<len;i++){const t=i/rate,n=Math.floor(t/1.5)%8,f=[261.63,329.63,392,523.25,440,392,329.63,293.66][n],env=Math.sin(Math.PI*(t%1.5)/1.5)**2;const a=(Math.sin(2*Math.PI*f*t)*.28+Math.sin(2*Math.PI*f*.5*t)*.12)*env*Math.min(1,t,12-t);v.setInt16(44+i*2,Math.max(-1,Math.min(1,a))*32767,true)}demoAudioUrl=URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));return demoAudioUrl}
async function musicRequest(path){const c=new AbortController(),timer=setTimeout(()=>c.abort(),18000);try{const r=await fetch(MUSIC_ORIGIN+path,{signal:c.signal});const j=await r.json();if(!r.ok||j.error)throw Error(j.error||"音乐服务暂不可用");return j}finally{clearTimeout(timer)}}
async function searchMusic(q){musicQuery=q.trim();musicResults=[];musicError="";if(!musicQuery){renderPhone();return}musicBusy=true;renderPhone();try{const j=await musicRequest("/music/search?q="+encodeURIComponent(musicQuery));musicResults=j.songs||[];if(!musicResults.length)musicError="没有搜索到歌曲，换个关键词试试。"}catch(e){musicError="联网搜索暂不可用，仍可搜索本地曲库或导入音频。"}finally{musicBusy=false;renderPhone()}}
function addOnline(id){const s=musicResults.find(x=>x.id===id);if(!s)return null;let existing=project.songs.find(x=>x.neteaseId===s.neteaseId);if(!existing){existing=copy(s);existing.id="ne_"+s.neteaseId;project.songs.push(existing)}return existing}
async function playSong(id,queue){const s=project.songs.find(x=>x.id===id);if(!s)return;if(currentTrack===id&&player.src&&!loadingTrack){if(player.paused){try{await player.play()}catch{toast("音频暂时无法播放，请检查音源")}}else player.pause();renderPhone();return}currentTrack=id;playQueue=queue?.length?queue:project.songs.map(s=>s.id);loadingTrack=true;player.pause();player.removeAttribute("src");player.load();playing=false;renderPhone();try{let url=s.source==="demo"?demoWav():safeAudio(s.audioUrl);if(s.source==="netease"||s.neteaseId){const j=await musicRequest("/music/song?id="+encodeURIComponent(s.neteaseId));url=safeAudio(j.url)}if(currentTrack!==id)return;if(!url)throw Error("这首歌还没有音频，请上传文件或填写可播放链接");player.src=url;await player.play();if("mediaSession" in navigator&&typeof MediaMetadata!=="undefined")navigator.mediaSession.metadata=new MediaMetadata({title:s.title,artist:s.artist,album:s.album})}catch(err){toast(err.message||"这首歌曲暂不可播放，可导入本地音频")}finally{if(currentTrack===id)loadingTrack=false;renderPhone()}}
function nextSong(dir=1){if(!playQueue.length)playQueue=project.songs.map(s=>s.id);if(!playQueue.length)return;const i=playQueue.indexOf(currentTrack),id=playQueue[(i+dir+playQueue.length)%playQueue.length];if(id===currentTrack){player.currentTime=0;player.play().catch(()=>{});return}playSong(id,playQueue)}
function updateAudioUI(){const a=$("#audio-current"),b=$("#audio-duration"),r=$("#audio-seek");if(a)a.textContent=seconds(player.currentTime);if(b)b.textContent=seconds(player.duration);if(r)r.value=Number.isFinite(player.duration)&&player.duration?String(player.currentTime/player.duration*1000):"0"}
player.addEventListener("play",()=>{playing=true;renderPhone()});player.addEventListener("pause",()=>{playing=false;if(!loadingTrack)renderPhone()});player.addEventListener("timeupdate",updateAudioUI);player.addEventListener("loadedmetadata",updateAudioUI);player.addEventListener("ended",()=>{if(playMode==="one"){player.currentTime=0;player.play().catch(()=>{})}else nextSong()});player.addEventListener("error",()=>{playing=false;loadingTrack=false;toast("此音源暂不可播放，可换一首或导入本地音频");renderPhone()});

/* 静态站点：搜歌不依赖本站服务器，分享链接保留作品片段。 */
const CATALOG_API = "https://music-api.gdstudio.xyz/api.php";
const catalogCache = new Map();
const songKey = s => JSON.stringify([String(s.title||"").trim(),String(s.artist||"").trim()]);
const musicName = s => String(s||"").normalize("NFKC").toLocaleLowerCase().replace(/[\s\p{P}\p{S}]/gu,"");
const officialSongUrl = id => /^\d{1,16}$/.test(String(id)) ? "https://music.163.com/song/media/outer/url?id="+id+".mp3" : "";
let songRequestNumber=0,loadedSongKey="";

const normalizeBeforeAuto=normalize;
normalize=function(data){const d=normalizeBeforeAuto(data);for(const s of d.songs){if((!s.source||s.source==="url")&&!s.audioUrl&&!s.neteaseId)s.source="auto"}return d};
const makeBeforeAuto=makeItem;
makeItem=function(key){const s=makeBeforeAuto(key);if(key==="songs"){s.source="auto";s.title="";s.artist="";s.album=""}return s};
FIELDS.songs=[["title","歌名"],["artist","歌手"],["album","专辑 / 来源（可选）"],["lyrics","歌词（可选，每行一句或 LRC）","textarea",true]];
const inputBeforeAuto=editInput;
editInput=function(el){if(section==="songs"&&["title","artist"].includes(el.dataset.itemField)){const s=currentItem();if(s&&s[el.dataset.itemField]!==el.value){delete s.matched;if(s.source==="demo"||s.source==="netease")s.source="auto"}}return inputBeforeAuto(el)};

async function catalogSearch(query){
 const q=String(query||"").trim().slice(0,100);if(!q)return [];
 const cached=catalogCache.get(q);if(cached&&Date.now()-cached.time<600000)return cached.promise;
 const promise=(async()=>{const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),18000);
  try{const params=new URLSearchParams({types:"search",source:"netease",name:q,count:"30",pages:"1"});
   const response=await fetch(CATALOG_API+"?"+params,{signal:ctrl.signal,credentials:"omit",referrerPolicy:"no-referrer"});
   if(!response.ok)throw Error(response.status===429?"搜歌请求较多，请稍后再试":"搜歌服务暂时不可用，请稍后再试");
   const rows=await response.json();if(!Array.isArray(rows))throw Error("搜歌服务暂时不可用，请稍后再试");
   return rows.filter(s=>/^\d{1,16}$/.test(String(s.id))&&(!s.source||s.source==="netease")).map(s=>({id:"ne_"+s.id,neteaseId:String(s.id),source:"netease",title:String(s.name||""),artist:Array.isArray(s.artist)?s.artist.join(" / "):String(s.artist||""),album:String(s.album||""),cover:"",audioUrl:"",lyrics:""}));
  }catch(e){if(e.name==="AbortError")throw Error("搜歌超时，请检查网络后重试");throw e}finally{clearTimeout(timer)}
 })();catalogCache.set(q,{time:Date.now(),promise});
 try{return await promise}catch(e){catalogCache.delete(q);throw e}
}
function exactSongMatch(song,results){
 const title=musicName(song.title),artist=musicName(song.artist);
 if(!title)return null;
 return results.find(row=>musicName(row.title)===title&&(!artist||musicName(row.artist)===artist||row.artist.split(/\s*[/、&；;]\s*/).some(name=>musicName(name)===artist)))||null;
}
async function resolveNamedSong(song){
 if(!String(song.title||"").trim())throw Error("请先在编辑器里填写歌名和歌手");
 const key=songKey(song);if(song.matched?.key===key&&officialSongUrl(song.matched.id))return song.matched;
 let found=exactSongMatch(song,await catalogSearch([song.title,song.artist].filter(Boolean).join(" ")));
 if(!found&&song.artist)found=exactSongMatch(song,await catalogSearch(song.title));
 if(!found)throw Error("没有找到与歌名和歌手一致的版本。请检查名称，或联网搜索选择具体版本。");
 return {key,id:found.neteaseId,title:found.title,artist:found.artist,album:found.album};
}
musicRequest=async function(path){const u=new URL(path,"https://music.invalid");
 if(u.pathname==="/music/search")return {songs:await catalogSearch(u.searchParams.get("q"))};
 if(u.pathname==="/music/song"){const url=officialSongUrl(u.searchParams.get("id"));if(!url)throw Error("歌曲 ID 无效");return {url}}throw Error("音乐请求无效");
};
searchMusic=async function(query){musicQuery=query.trim();musicResults=[];musicError="";const requested=musicQuery;if(!requested){renderPhone();return}musicBusy=true;renderPhone();
 try{const songs=await catalogSearch(requested);if(musicQuery!==requested)return;musicResults=songs;if(!songs.length)musicError="没有搜索到歌曲，换个关键词试试。"}
 catch(e){if(musicQuery===requested)musicError=e.message}
 finally{if(musicQuery===requested){musicBusy=false;renderPhone()}}
};
playSong=async function(id,queue){
 const song=project.songs.find(s=>s.id===id);if(!song)return;
 const key=JSON.stringify([songKey(song),song.source,song.audioUrl,song.neteaseId]);
 if(currentTrack===id&&player.src&&loadedSongKey===key&&!loadingTrack&&!player.error){
  if(player.paused){try{await player.play()}catch(e){toast(e.name==="NotAllowedError"?"歌曲已就绪，请再点一次播放":"这首歌暂时无法播放，请检查网络或使用备用音源")}}else player.pause();renderPhone();return;
 }
 const request=++songRequestNumber;currentTrack=id;loadedSongKey="";playQueue=queue?.length?queue:project.songs.map(s=>s.id);loadingTrack=true;
 player.pause();player.removeAttribute("src");player.load();playing=false;renderPhone();
 try{let url="";
  if(song.source==="demo")url=demoWav();
  else if(song.source==="url"&&safeAudio(song.audioUrl))url=safeAudio(song.audioUrl);
  else if(song.source==="netease"&&song.neteaseId)url=officialSongUrl(song.neteaseId);
  else{const match=await resolveNamedSong(song);if(request!==songRequestNumber||songKey(song)!==match.key)return;song.matched=match;url=officialSongUrl(match.id);if(!exported&&!shared){changed();if(section==="songs")renderEditor()}}
  if(request!==songRequestNumber)return;
  if(!url)throw Error("没有可用音源，请填写歌名和歌手后重试");
  player.src=url;loadedSongKey=key;await player.play();
  if("mediaSession" in navigator&&typeof MediaMetadata!=="undefined")navigator.mediaSession.metadata=new MediaMetadata({title:song.title,artist:song.artist,album:song.album});
 }catch(e){if(request!==songRequestNumber)return;
  if(e.name==="NotAllowedError")toast("歌曲已就绪，请再点一次播放");
  else{player.removeAttribute("src");loadedSongKey="";toast(e.message?.startsWith("没有")||e.message?.startsWith("搜歌")||e.message?.startsWith("请先")?e.message:"平台暂不提供这首歌的播放，请换歌或使用备用音源")}
 }finally{if(request===songRequestNumber){loadingTrack=false;renderPhone()}}
};

const collectionBeforeAuto=renderCollection;

 const s=currentItem(),mark=html.indexOf('<div class="card"><h2>当前歌曲音频</h2>');if(mark>=0)html=html.slice(0,mark);
 const matched=s.matched?.key===songKey(s)?s.matched:null;
 return html+`<div class="card"><h2>填歌名，点一下就听</h2><p class="help">填写上方的歌名和歌手，作品里点击歌曲即可自动搜索并尝试播放，无需复制链接。</p>${matched?`<div class="note">已匹配：${esc(matched.title)} · ${esc(matched.artist)}</div>`:""}<div class="edit-toolbar"><button class="primary" type="button" data-do="preview-song">匹配并试听当前歌曲</button><button class="secondary" type="button" data-do="open-music-search">搜索其他版本</button></div><details style="margin-top:20px"><summary>备用音源（可选）</summary><div class="field-grid" style="margin-top:16px">${field("source","播放方式",s.source||"auto","select",true,[["auto","按歌名＋歌手自动匹配（默认）"],["url","使用上传文件 / 音频链接"],["netease","使用指定网易云歌曲 ID"],["demo","内置示例音轨"]])}${field("audioUrl","备用音频链接",s.audioUrl,"text",true)}${field("neteaseId","指定网易云歌曲 ID",s.neteaseId,"text",true)}${audioField()}</div>${s.audioName?`<p class="help">已上传：${esc(s.audioName)}</p>`:""}</details><p class="help">在线音乐需要联网。会员、下架及平台限制的曲目可能无法播放。</p><small class="help">搜歌元数据由 <a href="https://music.gdstudio.xyz/" target="_blank" rel="noopener noreferrer">GD音乐台</a> 提供 · 非商业学习用途 · 播放使用网易云官方外链</small></div>`;
};

musicHTML=function(){const view=musicBeforeAuto();view.html=view.html.replace("本地 / 自定义音源","歌名＋歌手自动匹配 · 平台可播放范围以实际为准");return view};

function cleanShareBase(raw){try{const url=new URL(String(raw||"").trim());if(url.protocol!=="https:"&&!(url.protocol==="http:"&&["localhost","127.0.0.1"].includes(url.hostname)))return "";url.hash="";url.search="";return url.href}catch{return ""}}
function shareBase(){try{return cleanShareBase(localStorage.getItem("shiguang-share-base"))||PUBLIC_EDITOR_URL}catch{return PUBLIC_EDITOR_URL}}
async function showShareUrl(url){const area=$("#share-url");area.value=url;let copied=false;try{await navigator.clipboard.writeText(url);copied=true}catch{area.focus();area.select();try{copied=document.execCommand("copy")}catch{}}
 $("#share-note").textContent=`链接已生成（约 ${Math.max(1,Math.round(url.length/1024))} KB），域名：${new URL(url).hostname}。${copied?"已复制，可以发送给读者。":"请选中并复制上方链接。"}`;toast(copied?"新站作品链接已复制":"链接已生成，请手动复制");
}
shareLink=async function(){try{const base=cleanShareBase($("#share-base")?.value||shareBase());if(!base)throw Error("请填写已发布编辑器的 HTTPS 地址");const payload=await encodeShare(project),url=base+"#p="+payload;if(url.length>100000)throw Error("作品图片或音频较多，请导出独立 HTML 分享");try{localStorage.setItem("shiguang-share-base",base)}catch{}await showShareUrl(url)}catch(e){toast(e.message)}};
async function convertOldLink(){try{const base=cleanShareBase($("#share-base")?.value||shareBase());if(!base)throw Error("请填写新站点地址");const old=new URL($("#old-share-link").value.trim());if(!old.hash.startsWith("#p="))throw Error("请粘贴带 #p= 作品数据的完整旧链接");if(old.hash.length>100000)throw Error("链接过长，请使用项目 JSON 迁移");const data=await decodeShare(old.hash.slice(3));if(!data?.meta||!Array.isArray(data.apps))throw Error("这个链接不包含有效作品");await showShareUrl(base+old.hash)}catch(e){toast("转换失败："+e.message)}}
const exportBeforeMigration=renderExport;
